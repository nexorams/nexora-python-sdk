[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexorams"
version = "1.0.1"
description = "Official Python SDK for the Nexora Developer Platform"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Nexora Technologies", email = "developer@nexoragms.com" },
]
keywords = [
    "nexora",
    "sdk",
    "api",
    "developer",
    "multi-tenant",
    "organizations",
    "webhooks",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://nexoragms.com/developers"
Documentation = "https://docs.nexoragms.com"
Repository = "https://github.com/nexorams/nexora-python-sdk"
Issues = "https://github.com/nexorams/nexora-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexorams"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
